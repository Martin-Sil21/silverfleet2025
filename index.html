
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                '50': '#f0faff',
                '100': '#e0f3ff',
                '200': '#b9e7ff',
                '300': '#7ccfff',
                '400': '#36b1ff',
                '500': '#078eff',
                '600': '#0070e1',
                '700': '#005dc5',
                '800': '#004c9f',
                '900': '#004083',
                '950': '#00254d',
              },
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
          }
        }
      }
    </script>
    <style>
      /* Scrollbar personalizado elegante */
      .scrollbar-thin {
        scrollbar-width: thin;
      }
      
      /* Webkit scrollbars (Chrome, Safari, Edge) */
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      .scrollbar-thumb-gray-300::-webkit-scrollbar-thumb {
        background-color: #d1d5db;
        border-radius: 10px;
      }
      
      .scrollbar-thumb-gray-400::-webkit-scrollbar-thumb {
        background-color: #9ca3af;
        border-radius: 10px;
      }
      
      .scrollbar-thumb-gray-600::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 10px;
      }
      
      .scrollbar-thumb-gray-700::-webkit-scrollbar-thumb {
        background-color: #374151;
        border-radius: 10px;
      }
      
      .scrollbar-thumb-green-600::-webkit-scrollbar-thumb {
        background-color: #059669;
        border-radius: 10px;
      }
      
      .scrollbar-track-transparent::-webkit-scrollbar-track {
        background-color: transparent;
      }
      
      .scrollbar-track-gray-800::-webkit-scrollbar-track {
        background-color: #1f2937;
      }
      
      /* Hover effects */
      .hover\:scrollbar-thumb-gray-400:hover::-webkit-scrollbar-thumb {
        background-color: #9ca3af;
      }
      
      .hover\:scrollbar-thumb-gray-500:hover::-webkit-scrollbar-thumb {
        background-color: #6b7280;
      }
      
      .hover\:scrollbar-thumb-gray-600:hover::-webkit-scrollbar-thumb {
        background-color: #4b5563;
      }
      
      /* Dark mode scrollbars */
      @media (prefers-color-scheme: dark) {
        .dark\:scrollbar-thumb-gray-600::-webkit-scrollbar-thumb {
          background-color: #4b5563;
        }
        
        .dark\:scrollbar-thumb-gray-700::-webkit-scrollbar-thumb {
          background-color: #374151;
        }
        
        .dark\:hover\:scrollbar-thumb-gray-500:hover::-webkit-scrollbar-thumb {
          background-color: #6b7280;
        }
        
        .dark\:hover\:scrollbar-thumb-gray-600:hover::-webkit-scrollbar-thumb {
          background-color: #4b5563;
        }
      }
      
      /* Hide scrollbar on hover for cleaner look */
      .scrollbar-hide-until-hover::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      
      .scrollbar-hide-until-hover:hover::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>
</head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
