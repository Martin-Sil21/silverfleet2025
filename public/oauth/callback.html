<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizando...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #ff6b6b;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Autorizando con Google...</h2>
    <p id="message">Un momento por favor</p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      console.log('🔐 OAuth Callback ejecutado');
      console.log('📍 URL completa:', window.location.href);
      console.log('📦 Parámetros:', { code: code ? 'presente' : 'ausente', state: state ? 'presente' : 'ausente', error });
      console.log('🪟 window.opener:', window.opener ? 'presente' : 'NULL (PROBLEMA)');

      if (error) {
        document.getElementById('message').textContent = 'Autorización cancelada';
        document.querySelector('.spinner').style.display = 'none';
        
        // Enviar error a la ventana padre
        if (window.opener) {
          console.log('📤 Enviando error a ventana padre');
          window.opener.postMessage({
            type: 'OAUTH_ERROR',
            error: error
          }, window.location.origin);
        } else {
          console.error('❌ No hay window.opener - se abrió como pestaña nueva');
          alert('❌ Error: Esta ventana se abrió como pestaña nueva en lugar de popup.\n\nSolución: Habilita popups para localhost en tu navegador y vuelve a intentar.');
        }
        
        setTimeout(() => window.close(), 3000);
        return;
      }

      if (!code || !state) {
        document.getElementById('message').textContent = 'Parámetros inválidos';
        document.querySelector('.spinner').style.display = 'none';
        
        if (window.opener) {
          window.opener.postMessage({
            type: 'OAUTH_ERROR',
            error: 'invalid_parameters'
          }, window.location.origin);
        } else {
          console.error('❌ No hay window.opener');
          alert('❌ Error: Ventana padre no encontrada.\n\nEsta ventana debe abrirse como popup, no como pestaña nueva.');
        }
        
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Enviar código a la ventana padre
      if (window.opener && !window.opener.closed) {
        console.log('📤 Enviando código de autorización a ventana padre');
        window.opener.postMessage({
          type: 'OAUTH_SUCCESS',
          code: code,
          state: state
        }, window.location.origin);
        
        document.getElementById('message').textContent = '¡Autorización exitosa! Cerrando...';
        console.log('✅ Mensaje enviado, cerrando popup en 1 segundo');
        setTimeout(() => {
          console.log('🚪 Cerrando popup');
          window.close();
        }, 1000);
      } else {
        console.error('❌ window.opener no está disponible o fue cerrado');
        document.getElementById('message').innerHTML = '❌ Error: No se puede comunicar con la ventana principal.<br><br>Cierra esta ventana manualmente y vuelve a intentar.<br><br><strong>Asegúrate de que los popups estén habilitados.</strong>';
        document.querySelector('.spinner').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
